<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ori Asher — Portfolio 2026</title>
  <meta name="description" content="Ori Asher — Creative Developer. An interactive portfolio set in a modern room, on a MacBook." />
  <meta name="theme-color" content="#d9dae0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ccircle cx='32' cy='33' r='15' fill='none' stroke='%23fff' stroke-width='7'/%3E%3Ccircle cx='50' cy='15' r='6' fill='%23fff'/%3E%3C/svg%3E" />
  <meta property="og:title" content="Ori Asher — Portfolio 2026" />
  <meta property="og:description" content="An interactive portfolio set in a modern room, on a MacBook." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="stage"></div>
  <div id="vignette"></div>

  <!-- HUD -->
  <div id="hud" aria-label="Ori Asher">
    <div class="tag" id="hud-name">Ori Asher</div>
    <div class="tag" id="hud-title">Creative Developer</div>
    <div class="row">
      <div class="tag" id="hud-clock">00:00:00</div>
      <button class="tag btn" id="btn-sound" aria-label="Toggle sound" title="Sound"></button>
      <button class="tag btn" id="btn-time" aria-label="Time of day" title="Time of day (T)"></button>
      <button class="tag btn" id="btn-view" aria-label="Toggle camera" title="Zoom in / out"></button>
    </div>
    <div class="tag" id="hud-found" title="Things you have found in the room">Discovered 0/0</div>
    <button class="tag" id="hud-trophies" title="Achievements — open the Arcade">Trophies 0/0</button>
  </div>

  <div id="prompt" class="tag" role="button" tabindex="0">Click the laptop to start — or look around with the arrows</div>
  <div id="hint" class="tag">Press Esc or the camera button to zoom out</div>
  <div id="room-tag" class="tag" aria-hidden="true"></div>
  <!-- Look around (T40): chevrons at the edges + station dots; shown while you are looking at the room -->
  <button id="nav-left" class="tag nav-chev left" aria-label="Look left" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.500 5.500L8 12l6.500 6.500"/></svg><i class="bd" hidden></i></button>
  <button id="nav-right" class="tag nav-chev right" aria-label="Look right" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.500 5.500L16 12l-6.500 6.500"/></svg><i class="bd" hidden></i></button>
  <div id="st-dots" class="st-dots" role="group" aria-label="Look around" hidden></div>
  <div id="toasts" aria-live="polite"></div>

  <!-- Intro (T46): the live room behind a frosted veil; ui/intro.js runs the greeting and shows the button when the room is ready -->
  <div id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title" aria-describedby="intro-status">
    <div class="iv-veil" aria-hidden="true"></div>
    <div class="iv-blobs" aria-hidden="true"><i></i><i></i><i></i></div>
    <button id="intro-sound" class="iv-sound" type="button" aria-pressed="true" aria-label="Sound on"></button>
    <div class="iv-hero">
      <h1 id="intro-title" class="iv-title"><span id="intro-greet" class="iv-greet" lang="en" aria-hidden="true"></span><span id="intro-name" class="iv-name">Ori Asher</span></h1>
      <p id="intro-sub" class="iv-sub"></p>
    </div>
    <div class="iv-cta">
      <div id="intro-wait" class="iv-wait" hidden><svg id="intro-ring" class="iv-ring" viewBox="0 0 30 30" aria-hidden="true"><circle class="bg" cx="15" cy="15" r="13"/><circle class="fg" cx="15" cy="15" r="13"/></svg><span id="intro-status" role="status" aria-live="polite">Preparing the room…</span></div>
      <button id="intro-start" class="iv-btn" type="button" hidden>Enter</button>
      <p id="intro-hint" class="iv-hint" hidden>or press Return</p>
    </div>
  </div>

  <noscript><p style="padding:24px;font-family:sans-serif">This portfolio needs JavaScript and WebGL.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
